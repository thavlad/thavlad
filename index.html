<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUMUS Store | Official Tech Store</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- Header -->
  <header class="top-nav">
    <div class="container nav-flex">
      <!-- Logo with Embedded Red S -->
      <a href="index.html" class="brand-logo">
        <span class="logo-s-badge">S</span>
        <span>SUMUS</span>
      </a>

      <!-- Navigation Links -->
      <nav style="display:flex; gap:1.5rem;">
        <a href="index.html" style="color:white; font-weight:600;">Home</a>
        <a href="shop.html" style="color:white;">Shop Products</a>
        <a href="cart.html" style="color:white;">Cart (<span id="cart-count">0</span>)</a>
      </nav>
    </div>
  </header>

  <!-- Category Bar -->
  <div class="cat-bar">
    <div class="container cat-links">
      <a href="shop.html?cat=phones">Smartphones</a>
      <a href="shop.html?cat=laptops">Laptops</a>
      <a href="shop.html?cat=audio">Audio & Accessories</a>
      <a href="shop.html?cat=tablets">Tablets</a>
    </div>
  </div>

  <!-- Hero Section -->
  <main class="container" style="margin-top:2rem;">
    <section style="background:#0b1d35; color:white; padding:3rem; border-radius:1rem; text-align:center;">
      <h1 style="font-size:2.5rem; margin-bottom:1rem;">Welcome to SUMUS Store</h1>
      <p style="margin-bottom:1.5rem; color:#d1d5db;">Nigeria's Premier Retail Destination for Genuine Mobile & Tech Devices.</p>
      <a href="shop.html" class="btn-primary">Shop Latest Tech</a>
    </section>

    <!-- Featured Products -->
    <section style="margin-top:3rem;">
      <h2 style="margin-bottom:1.5rem;">Featured Products</h2>
      <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:1.5rem;">
        
        <div class="product-card">
          <span class="product-badge">NEW</span>
          <img src="https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=300" alt="iPhone 15 Pro">
          <h3 style="font-size:1rem; margin-bottom:0.5rem;">iPhone 15 Pro 256GB</h3>
          <p style="color:#ee0000; font-weight:700; margin-bottom:1rem;">₦1,450,000</p>
          <button onclick="addToCart(1, 'iPhone 15 Pro', 1450000, '')" class="btn-primary">Add to Cart</button>
        </div>

      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
