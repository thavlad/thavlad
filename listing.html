<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Catalog – ShopNG</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="app-header"></div>

  <div class="only-mobile pills-wrap">
    <div class="pills" id="cat-pills"></div>
  </div>

  <main class="container">
    <div class="layout">
      <aside class="sidebar only-desktop">
        <h3>Categories</h3>
        <div id="cat-side"></div>
      </aside>

      <section class="main">
        <div class="listing-head">
          <h1 id="title">Products</h1>
          <p class="muted" id="count"></p>
        </div>

        <div class="toolbar">
          <div class="pills" id="price-pills"></div>
          <select id="sort" aria-label="Sort products">
            <option value="popular">Most popular</option>
            <option value="priceAsc">Price: low to high</option>
            <option value="priceDesc">Price: high to low</option>
            <option value="rating">Top rated</option>
          </select>
        </div>

        <div class="grid" id="grid"></div>
      </section>
    </div>
  </main>

  <div id="app-nav"></div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/integrations.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>

  <script>
    (async function () {
      const cat = param('cat') || 'all';
      const q = param('q') || '';
      const sort = param('sort') || 'popular';

      initLayout('categories');
      renderCategoryNav(cat);

      document.getElementById('sort').value = sort;
      document.getElementById('title').textContent = q ? `Search: "${q}"` : (CATEGORIES.find(c => c.slug === cat)?.name || 'All Products');

      try {
        const products = await API.listProducts({ category: cat, q, sort });
        document.getElementById('count').textContent = `${products.length} items found`;
        renderGrid('grid', products);
      } catch (err) {
        document.getElementById('grid').innerHTML = '<div class="empty"><span>⚠️</span><p>Error loading catalog.</p></div>';
      }

      document.getElementById('sort').addEventListener('change', (e) => {
        const url = new URL(window.location.href);
        url.searchParams.set('sort', e.target.value);
        window.location.href = url.toString();
      });
    })();
  </script>
</body>
</html>
