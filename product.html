<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details – ShopNG</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="container">
    <div class="product" id="product">
      <p class="muted">Loading product details…</p>
    </div>

    <section class="section-block">
      <div class="section-head"><h2>You may also like</h2></div>
      <div class="grid" id="related"></div>
    </section>
  </main>

  <div id="app-nav"></div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/integrations.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>

  <script>
    (async function () {
      initLayout();

      const id = param('id');
      if (!id) {
        window.location.href = 'index.html';
        return;
      }

      try {
        const product = await API.getProduct(id);
        const container = document.getElementById('product');

        const images = product.images && product.images.length > 0 ? product.images : [];
        const mainDisplay = images.length > 0 
          ? `<img id="main-product-img" src="${esc(images[0])}" alt="${esc(product.name)}" style="width:100%; max-height:350px; object-fit:contain;">` 
          : `<span style="font-size:120px;">${product.emoji}</span>`;

        const thumbnailsHtml = images.length > 1 
          ? `<div style="display:flex; gap:8px; margin-top:14px; justify-content:center; flex-wrap:wrap;">` + 
              images.slice(0, 6).map((img, idx) => `
                <img src="${esc(img)}" onclick="document.getElementById('main-product-img').src='${esc(img)}'" style="width:54px; height:54px; object-fit:cover; border-radius:10px; cursor:pointer; border:2px solid var(--border);">
              `).join('') + 
            `</div>` 
          : '';

        container.innerHTML = `
          <div class="product-img" style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
            ${mainDisplay}
            ${thumbnailsHtml}
          </div>
          <div class="product-info">
            <div class="brand">${esc(product.brand)}</div>
            <h1>${esc(product.name)}</h1>
            <div class="rating">⭐ ${product.rating} · ${product.sold} sold</div>
            <div class="price-row">
              <span class="price">${fmt(product.price)}</span>
              ${product.oldPrice ? `<s class="old">${fmt(product.oldPrice)}</s>` : ''}
            </div>
            <div class="stock ${product.stock > 0 ? 'ok' : 'out'}">
              ${product.stock > 0 ? `In Stock (${product.stock} left)` : 'Out of Stock'}
            </div>
            <p class="desc">${esc(product.desc)}</p>
            <div class="qty-row">
              <button class="qty-btn" onclick="changeQty(-1)">-</button>
              <span id="qty-val" style="font-weight:700;">1</span>
              <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            <button class="btn btn-block" onclick="addToCart(${product.id})" ${product.stock === 0 ? 'disabled' : ''}>
              🛒 Add to Cart
            </button>
          </div>
        `;

        let currentQty = 1;
        window.changeQty = (delta) => {
          currentQty = Math.max(1, Math.min(product.stock, currentQty + delta));
          document.getElementById('qty-val').textContent = currentQty;
        };

        window.addToCart = (prodId) => {
          try {
            API.cart.add(prodId, currentQty);
            updateCartBadge();
            toast('Added to cart!');
          } catch (err) {
            toast(err.message);
          }
        };

        // Load related items
        const allProds = await API.listProducts({ category: product.category });
        const related = allProds.filter(p => p.id !== product.id).slice(0, 4);
        renderGrid('related', related);

      } catch (err) {
        document.getElementById('product').innerHTML = '<div class="empty"><span>⚠️</span><p>Product not found.</p></div>';
      }
    })();
  </script>
</body>
</html>
