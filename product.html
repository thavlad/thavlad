<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product – ShopNG</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="container">
    <nav class="crumbs" id="crumbs"></nav>

    <div class="product" id="product">
      <p class="muted">Loading…</p>
    </div>

    <section class="section-block">
      <div class="section-head"><h2>You may also like</h2></div>
      <div class="grid" id="related"></div>
    </section>
  </main>

  <div id="app-nav"></div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/integrations.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    (async function () {
      initLayout('home');
      const root = document.getElementById('product');

      try {
        const p = await API.getProduct(param('id'));
        const inStock = p.stock > 0;
        document.title = `${p.name} – ShopNG`;
        document.getElementById('crumbs').innerHTML =
          `<a href="index.html">Home</a> / ` +
          `<a href="listing.html?cat=${p.category}">${esc(catName(p.category))}</a> / ` +
          `<span>${esc(p.name)}</span>`;

        root.innerHTML = `
          <div class="product-img">${p.emoji}</div>
          <div class="product-info">
            <p class="brand">${esc(p.brand)}</p>
            <h1>${esc(p.name)}</h1>
            <div class="rating">⭐ ${p.rating} · ${p.sold} sold</div>
            <div class="price-row">
              <span class="price">${fmt(p.price)}</span>${p.oldPrice ? `<s class="old">${fmt(p.oldPrice)}</s>` : ''}
            </div>
            <p class="delivery">${esc(p.delivery)}</p>
            <p class="stock ${inStock ? 'ok' : 'out'}">
              ${inStock ? (p.stock <= 5 ? `Only ${p.stock} left in stock` : 'In stock') : 'Out of stock'}
            </p>
            <p class="desc">${esc(p.desc)}</p>
            <div class="qty-row">
              <button class="qty-btn" id="dec" aria-label="Decrease quantity">−</button>
              <span id="qty">1</span>
              <button class="qty-btn" id="inc" aria-label="Increase quantity">+</button>
            </div>
            <button class="btn btn-block" id="add" ${inStock ? '' : 'disabled'}>
              ${inStock ? 'Add to Cart' : 'Out of stock'}
            </button>
          </div>`;

        let qty = 1;
        const qtyEl = document.getElementById('qty');
        document.getElementById('dec').onclick = () => {
          qty = Math.max(1, qty - 1);
          qtyEl.textContent = qty;
        };
        document.getElementById('inc').onclick = () => {
          qty = Math.min(p.stock, qty + 1);
          qtyEl.textContent = qty;
        };
        document.getElementById('add').onclick = () => {
          try {
            API.cart.add(p.id, qty);
            updateCartBadge();
            toast(`${p.name} added to cart`);
          } catch (err) {
            toast(err.message);
          }
        };

        const related = (await API.listProducts({ category: p.category }))
          .filter(x => x.id !== p.id)
          .slice(0, 4);
        renderGrid('related', related);
      } catch (err) {
        root.innerHTML = `
          <div class="empty">
            <span>😕</span>
            <p>${esc(err.message)}</p>
            <a class="btn" href="index.html">Back to shop</a>
          </div>`;
      }
    })();
  </script>
</body>
</html>
