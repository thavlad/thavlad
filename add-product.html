<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product - ShopNG Admin</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .form-container { max-width: 600px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    .image-preview { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .image-preview img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }
  </style>
</head>
<body>

  <main class="container">
    <div class="form-container">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>➕ Add New Product</h2>
        <a href="admin.html" class="btn btn-secondary">← Back to Admin</a>
      </div>

      <form id="add-product-form">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="p-name" required placeholder="e.g. Smart Watch">
        </div>

        <div class="form-group">
          <label>Category</label>
          <select id="p-category" required>
            <option value="electronics">Electronics</option>
            <option value="fashion">Fashion</option>
            <option value="groceries">Groceries</option>
          </select>
        </div>

        <div class="form-group">
          <label>Price (₦)</label>
          <input type="number" id="p-price" required min="0">
        </div>

        <div class="form-group">
          <label>Initial Stock</label>
          <input type="number" id="p-stock" required min="0" value="10">
        </div>

        <div class="form-group">
          <label>Emoji Icon</label>
          <input type="text" id="p-emoji" placeholder="e.g. ⌚" value="📦">
        </div>

        <div class="form-group">
          <label>Product Images (Max 6 local images)</label>
          <input type="file" id="p-images" multiple accept="image/*" />
          <div class="image-preview" id="image-preview-container"></div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Create Product</button>
      </form>
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await API.admin.check().catch(() => window.location.replace('login.html'));

      const imgInput = document.getElementById('p-images');
      const previewContainer = document.getElementById('image-preview-container');
      let imagePaths = [];

      imgInput.addEventListener('change', (e) => {
        previewContainer.innerHTML = '';
        imagePaths = Array.from(e.target.files).slice(0, 6).map(f => `images/${f.name}`);
        imagePaths.forEach(path => {
          const img = document.createElement('img');
          img.src = path;
          img.onerror = () => { img.src = 'images/placeholder.png'; };
          previewContainer.appendChild(img);
        });
      });

      document.getElementById('add-product-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const productData = {
          name: document.getElementById('p-name').value,
          category: document.getElementById('p-category').value,
          price: Number(document.getElementById('p-price').value),
          stock: Number(document.getElementById('p-stock').value),
          emoji: document.getElementById('p-emoji').value || '📦',
          images: imagePaths,
          status: 'active'
        };

        const d = db();
        productData.id = Date.now();
        d.products.push(productData);
        saveDb(d);
        await API.admin.logAction(`Added new product '${productData.name}'`);

        alert('Product added successfully!');
        window.location.href = 'admin.html';
      });
    });
  </script>
</body>
</html>
