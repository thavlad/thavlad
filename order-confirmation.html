<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation - ShopNG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Site Header container populated by initLayout() -->
  <div id="app-header"></div>

  <main class="container">
    <div class="confirm" id="confirmation-container">
      <div class="check">✓</div>
      <h1>Order Placed Successfully!</h1>
      <p class="muted" id="order-subtitle">Loading your order details...</p>

      <div class="confirm-items" id="order-details-content">
        <!-- Dynamically populated items and delivery summary -->
      </div>

      <div class="actions">
        <a href="account.html" class="btn">View My Orders</a>
        <a href="index.html" class="btn btn-block" style="max-width: 200px;">Continue Shopping</a>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation container populated by initLayout() -->
  <div id="app-bottom-nav"></div>

  <!-- Include your shared API, helpers, and scripts -->
  <script src="api.js"></script>
  <script src="shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Initialize site header, bottom navigation, and cart badge
      initLayout();

      const orderId = param('id');
      const subtitleEl = document.getElementById('order-subtitle');
      const contentEl = document.getElementById('order-details-content');

      if (!orderId) {
        subtitleEl.textContent = 'No order ID provided.';
        contentEl.innerHTML = '<p class="muted">Please check your order history in your account.</p>';
        return;
      }

      try {
        // Fetch order details from the mock backend API
        const order = await API.getOrder(orderId);
        
        subtitleEl.innerHTML = `Order Reference: <strong>#${order.id}</strong><br>Tracking Number: <strong>${order.trackingNumber || 'Pending'}</strong>`;
        
        let itemsHtml = '<h3>Items Ordered</h3><ul style="list-style: none; padding: 0; margin-top: 10px;">';
        if (order.items && order.items.length > 0) {
          order.items.forEach(item => {
            itemsHtml += `<li style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border);">
              <span>${esc(item.name)} (x${item.qty})</span>
              <strong>${fmt(item.price * item.qty)}</strong>
            </li>`;
          });
        }
        itemsHtml += `</ul>`;
        
        itemsHtml += `<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 6px; font-size: 14px;">
          <div><strong>Delivery Address:</strong> ${esc(order.address)}, ${esc(order.city)}</div>
          <div><strong>Payment Method:</strong> ${esc(order.payment)}</div>
          <div style="font-size: 16px; margin-top: 8px;"><strong>Total Paid: ${fmt(order.total)}</strong></div>
        </div>`;

        contentEl.innerHTML = itemsHtml;
      } catch (err) {
        subtitleEl.textContent = 'Could not load order details.';
        contentEl.innerHTML = `<p class="muted">${esc(err.message || 'Order not found or unauthorized.')}</p>`;
      }
    });
  </script>
</body>
</html>
