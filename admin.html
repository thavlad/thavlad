<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - ShopNG</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .admin-nav { display: flex; gap: 10px; margin: 20px 0; border-bottom: 2px solid #eee; padding-bottom: 8px; }
    .admin-tab { padding: 8px 16px; cursor: pointer; border-radius: 6px; font-weight: 600; background: #f5f5f5; border: none; }
    .admin-tab.active { background: #16a34a; color: white; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: white; padding: 16px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .stat-card h4 { margin: 0; color: #666; font-size: 14px; }
    .stat-card .val { font-size: 24px; font-weight: 700; color: #111; margin-top: 8px; }
    .admin-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
    .admin-table th, .admin-table td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    .row-deleted { opacity: 0.5; background: #fff1f0; }
    .badge-warning { background: #fffbe6; color: #d46b08; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    .badge-success { background: #f6ffed; color: #389e0d; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <main class="container" style="margin-top: 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h1>⚙️ Store Admin Command Center</h1>
      <a href="account.html" class="btn btn-secondary">Exit Admin</a>
    </div>

    <!-- Analytics Cards -->
    <div class="stats-grid">
      <div class="stat-card"><h4>Total Revenue</h4><div class="val" id="stat-revenue">₦0</div></div>
      <div class="stat-card"><h4>Total Orders</h4><div class="val" id="stat-orders">0</div></div>
      <div class="stat-card"><h4>Average Order Value</h4><div class="val" id="stat-aov">₦0</div></div>
      <div class="stat-card"><h4>Low Stock Alerts</h4><div class="val" id="stat-lowstock" style="color: #d97706;">0</div></div>
    </div>

    <!-- Navigation Tabs -->
    <div class="admin-nav">
      <button class="admin-tab active" data-tab="tab-orders">📦 Orders</button>
      <button class="admin-tab" data-tab="tab-products">🏷️ Products & Stock</button>
      <button class="admin-tab" data-tab="tab-customers">👥 Customers</button>
      <button class="admin-tab" data-tab="tab-promos">🎟️ Promos</button>
      <button class="admin-tab" data-tab="tab-reviews">⭐ Reviews</button>
      <button class="admin-tab" data-tab="tab-audit">📜 Audit Logs</button>
    </div>

    <!-- TAB 1: ORDERS -->
    <div id="tab-orders" class="tab-content">
      <div style="display: flex; gap: 12px; margin-bottom: 16px;">
        <input type="text" id="order-search-input" placeholder="Search by Order ID or Email..." style="flex: 1; padding: 8px;" />
        <select id="order-status-filter" style="padding: 8px;">
          <option value="all">All Statuses</option>
          <option value="Processing">Processing</option>
          <option value="Shipped">Shipped</option>
          <option value="Delivered">Delivered</option>
        </select>
      </div>
      <table class="admin-table">
        <thead>
          <tr><th>Order ID</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="orders-tbody"></tbody>
      </table>
    </div>

    <!-- TAB 2: PRODUCTS -->
    <div id="tab-products" class="tab-content hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <label><input type="checkbox" id="toggle-trash-view"> Show Trash/Deleted Items</label>
        <a href="add-product.html" class="btn btn-primary">➕ Add Product Page</a>
      </div>
      <table class="admin-table">
        <thead>
          <tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
        </thead>
        <tbody id="products-tbody"></tbody>
      </table>
    </div>

    <!-- TAB 3: CUSTOMERS -->
    <div id="tab-customers" class="tab-content hidden">
      <table class="admin-table">
        <thead>
          <tr><th>Name</th><th>Email</th><th>Orders</th><th>LTV (Spend)</th><th>Account Control</th></tr>
        </thead>
        <tbody id="customers-tbody"></tbody>
      </table>
    </div>

    <!-- TAB 4: PROMOS -->
    <div id="tab-promos" class="tab-content hidden">
      <form id="add-promo-form" style="display: flex; gap: 8px; margin-bottom: 16px;">
        <input type="text" id="promo-code" placeholder="Code (e.g. LAGOS10)" required style="padding: 8px;" />
        <input type="number" id="promo-discount" placeholder="Discount %" required style="padding: 8px; width: 120px;" />
        <input type="number" id="promo-minspend" placeholder="Min Spend (₦)" required style="padding: 8px; width: 140px;" />
        <button type="submit" class="btn btn-primary">Create Promo</button>
      </form>
      <div id="promos-list"></div>
    </div>

    <!-- TAB 5: REVIEWS -->
    <div id="tab-reviews" class="tab-content hidden">
      <div id="reviews-list"></div>
    </div>

    <!-- TAB 6: AUDIT LOGS -->
    <div id="tab-audit" class="tab-content hidden">
      <table class="admin-table">
        <thead>
          <tr><th>Timestamp</th><th>Admin</th><th>Action Executed</th></tr>
        </thead>
        <tbody id="audit-tbody"></tbody>
      </table>
    </div>

  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
