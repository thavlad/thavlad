<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – ShopNG</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .admin-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }
    @media (min-width: 900px) { .admin-grid { grid-template-columns: 1fr 1fr; } }
    .admin-card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    .admin-table th, .admin-table td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border); }
    .stock-input { width: 60px; padding: 4px; text-align: center; }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
      <h1>⚙️ Admin Dashboard</h1>
      <span class="status" style="background: #dbeafe; color: #1e40af;">Admin Active</span>
    </div>

    <!-- Denied Box -->
    <div id="denied-box" class="empty hidden" style="margin-top: 20px;">
      <span>🔒</span>
      <p>Access Denied. You must log in as an administrator (admin@shopng.ng).</p>
      <a href="login.html" class="btn">Log in as Admin</a>
    </div>

    <!-- Main Content -->
    <div id="admin-content" class="hidden">
      <div class="admin-grid">
        
        <!-- Section: Store Orders -->
        <div class="admin-card">
          <h2>📦 All Orders</h2>
          <div id="admin-orders-list" style="margin-top: 14px;"><p class="muted">Loading orders...</p></div>
        </div>

        <!-- Section: Inventory & Add Product Link -->
        <div class="admin-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2>🏷️ Product Stock</h2>
            <a href="add-product.html" class="btn" style="font-size: 13px; padding: 6px 12px; background: var(--text); color: #fff;">➕ Add New Product</a>
          </div>
          <div style="overflow-x: auto;">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="admin-products-table"></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div id="app-nav"></div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/integrations.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>

  <script>
    (async function () {
      initLayout();

      const contentBox = document.getElementById('admin-content');
      const deniedBox = document.getElementById('denied-box');

      try {
        await API.admin.check();
        contentBox.classList.remove('hidden');
      } catch (err) {
        deniedBox.classList.remove('hidden');
        return;
      }

      async function reloadDashboard() {
        const orders = await API.admin.listAllOrders();
        const products = await API.listProducts();

        // Render Orders List
        const ordersContainer = document.getElementById('admin-orders-list');
        ordersContainer.innerHTML = orders.length === 0 
          ? '<p class="muted">No orders placed yet.</p>'
          : orders.map(o => `
            <div class="order-card" style="border: 1px solid var(--border);">
              <div>
                <strong>Order #${esc(o.id)}</strong><br>
                <span class="muted" style="font-size:12px;">Total: ${fmt(o.total)}</span>
              </div>
              <select style="font-size: 12px; padding: 4px;" onchange="updateOrderStatus('${o.id}', this.value)">
                <option value="Processing" ${o.status === 'Processing' ? 'selected' : ''}>Processing</option>
                <option value="Shipped" ${o.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
              </select>
            </div>
          `).join('');

        // Render Products Table
        const prodTable = document.getElementById('admin-products-table');
        prodTable.innerHTML = products.map(p => `
          <tr>
            <td>${p.emoji} <strong>${esc(p.name)}</strong></td>
            <td>${fmt(p.price)}</td>
            <td>
              <input class="stock-input" type="number" value="${p.stock}" onchange="updateProductStock(${p.id}, this.value)">
            </td>
            <td>
              <button style="background:none; border:none; color:var(--red); cursor:pointer;" onclick="deleteProduct(${p.id})">🗑️</button>
            </td>
          </tr>
        `).join('');
      }

      window.updateOrderStatus = async (id, status) => {
        await API.admin.updateOrderStatus(id, status);
        toast('Order status updated');
      };

      window.updateProductStock = async (id, stock) => {
        await API.admin.updateStock(id, stock);
        toast('Stock level updated');
      };

      window.deleteProduct = async (id) => {
        if (confirm('Delete this product from catalog?')) {
          await API.admin.deleteProduct(id);
          toast('Product deleted');
          reloadDashboard();
        }
      };

      reloadDashboard();
    })();
  </script>
</body>
</html>
